    name: klarity
    runtime: python
    plan: free
    buildCommand: "cd frontend && npm install && npm run build && cd ../backend && pip install -r requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        value: postgresql+psycopg2://postgres.fldqzetudzkzutwftvmn:Ashwiktopper%40123@aws-0-ap-northeast-1.pooler.supabase.com:6543/postgres
