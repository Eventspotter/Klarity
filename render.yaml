        value: "true"
      - key: SEED_DEMO_DATA
        value: "false"
      - key: CORS_ORIGINS
        value: "http://localhost:5173,http://127.0.0.1:5173,http://localhost:8000,http://127.0.0.1:8000,https://klarity-frontend.onrender.com"
